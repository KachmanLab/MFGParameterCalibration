[project]
name = "MFGParameterCalibration"
version = "0.1.0"
description = "Parameter calibration for finite-state mean field games using neural networks"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "diffrax==0.7.2",
    "equinox==0.13.6",
    "h5py==3.16.0",
    "hydra-core==1.3.2",
    "jax>=0.9.2",
    "matplotlib==3.10.8",
    "numpy==2.4.4",
    "omegaconf==2.3.0",
    "optax==0.2.8",
    "optimistix==0.1.0",
    "pytest==9.0.3",
    "pyyaml==6.0.3",
    "scipy==1.17.1",
    "torch==2.11.0",
    "pandas==3.0.2",
    "tqdm==4.67.3",
    "chex==0.1.91",
    "flax~=0.12.7",
    "scikit-learn==1.8.0",
    "notebook>=7.5.6",
]

[tool.ruff]
line-length = 120
